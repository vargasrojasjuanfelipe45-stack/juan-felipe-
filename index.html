<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletín de notas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="contenedor">
    <h1>Boletín de notas</h1>
    <p class="subtitulo">Registro de estudiante y cálculo de cinco notas</p>

    <form id="formulario">
      <label for="nombre">Nombre del estudiante</label>
      <input type="text" id="nombre" placeholder="Escribe el nombre" required>

      <label for="edad">Edad</label>
      <input type="number" id="edad" min="1" placeholder="Escribe la edad" required>

      <label for="identificacion">Número de identificación</label>
      <input type="text" id="identificacion" placeholder="Escribe la identificación" required>

      <h2>Notas</h2>
      <div class="notas">
        <div><label for="nota1">Nota 1</label><input type="number" id="nota1" min="0" max="5" step="0.1" required></div>
        <div><label for="nota2">Nota 2</label><input type="number" id="nota2" min="0" max="5" step="0.1" required></div>
        <div><label for="nota3">Nota 3</label><input type="number" id="nota3" min="0" max="5" step="0.1" required></div>
        <div><label for="nota4">Nota 4</label><input type="number" id="nota4" min="0" max="5" step="0.1" required></div>
        <div><label for="nota5">Nota 5</label><input type="number" id="nota5" min="0" max="5" step="0.1" required></div>
      </div>

      <button type="submit">Calcular boletín</button>
    </form>

    <section id="resultado" class="resultado" aria-live="polite"></section>
  </main>
  <script src="serie.js"></script>
</body>
</html>
